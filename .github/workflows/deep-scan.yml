name: Staff deep scan

on:
  workflow_dispatch:
    inputs:
      repository_id:
        description: Tavernary GitHub repository ID
        type: number
        required: true

concurrency:
  group: tavernkeeper-global-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
  actions: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    environment: tavernkeeper-staff
    permissions:
      contents: read
    outputs:
      requests_json: ${{ steps.request.outputs.requests_json }}
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve protected deep-scan request from Tavernary manifest
        id: request
        env:
          TAVERNKEEPER_STAFF_SCAN: '{"repository_id":${{ inputs.repository_id }},"mode":"deep"}'
        shell: bash
        run: |
          request="$(npm run --silent deep-scan)"
          echo "requests_json=$(jq -cn --argjson request "$request" '[$request]')" >> "$GITHUB_OUTPUT"

  scan:
    needs: resolve
    uses: ./.github/workflows/scan-and-publish.yml
    with:
      requests_json: ${{ needs.resolve.outputs.requests_json }}
      remaining: "0"
      continue_backlog: false
    secrets: inherit

name: Staff policy rescan

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tavernkeeper-global-scan
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    environment: tavernkeeper-staff
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create reviewed policy campaign
        run: npm run --silent policy-rescan
      - name: Create TavernKeeper Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_PRIVATE_KEY }}
          owner: MentallyQuill
          repositories: TavernKeeper
          permission-contents: write
      - name: Commit campaign state
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          gh auth setup-git
          git config user.name "TavernKeeper"
          git config user.email "tavernkeeper@users.noreply.github.com"
          git add operations/state.json
          git commit -m "chore(scans): schedule policy campaign"
          push_succeeded="false"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              push_succeeded="true"
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 15))"
            fi
          done
          test "$push_succeeded" = "true"
      - name: Dispatch reconcile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main

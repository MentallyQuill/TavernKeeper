name: Staff policy rescan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tavernkeeper-global-scan
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    environment: tavernkeeper-staff
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create reviewed policy campaign
        run: npm run --silent policy-rescan
      - name: Commit campaign state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "TavernKeeper"
          git config user.email "tavernkeeper@users.noreply.github.com"
          git add operations/state.json
          git commit -m "chore(scans): schedule policy campaign"
          git push origin HEAD:main
          gh workflow run reconcile.yml --ref main

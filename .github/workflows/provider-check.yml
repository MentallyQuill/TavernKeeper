name: "Staff: Check configured model provider"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tavernkeeper-provider-check
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    environment: tavernkeeper-staff
    permissions: {}
    steps:
      - name: Confirm protected staff authorization
        run: echo "Provider compatibility check authorized."
  check:
    needs: authorize
    runs-on: ubuntu-latest
    environment: tavernkeeper-scanner
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check one benign contextual review
        env:
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
        run: npm run --silent provider:check

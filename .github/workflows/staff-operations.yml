name: TavernKeeper staff operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Reviewed queue operation
        type: choice
        options: [pause, resume, retry, revoke, add-back, migrate]
        required: true
      repository_id:
        description: Tavernary repository ID for retry, revoke, or add-back
        type: number
        required: false
      reason_code:
        description: Uppercase pause reason code
        type: string
        required: false

permissions:
  contents: read
  actions: write

concurrency:
  group: tavernkeeper-staff-operations
  queue: max
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    environment: tavernkeeper-staff
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create TavernKeeper Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNKEEPER_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_PRIVATE_KEY }}
          owner: MentallyQuill
          repositories: TavernKeeper
          permission-contents: write
      - name: Apply and commit validated staff operation
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          OPERATION: ${{ inputs.operation }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          REASON_CODE: ${{ inputs.reason_code }}
        run: |
          run_operation() {
            if [[ "$OPERATION" = "migrate" ]]; then
              env -u GH_TOKEN -u GITHUB_TOKEN npm run --silent state:migrate
            elif [[ "$OPERATION" = "pause" ]]; then
              request="$(jq -nc --arg operation "$OPERATION" --arg reason_code "$REASON_CODE" '{operation:$operation,reason_code:$reason_code}')"
              env -u GH_TOKEN -u GITHUB_TOKEN TAVERNKEEPER_OPERATION="$request" npm run --silent retry
            elif [[ "$OPERATION" = "retry" || "$OPERATION" = "revoke" || "$OPERATION" = "add-back" ]]; then
              request="$(jq -nc --arg operation "$OPERATION" --argjson repository_id "$REPOSITORY_ID" '{operation:$operation,repository_id:$repository_id}')"
              env -u GH_TOKEN -u GITHUB_TOKEN TAVERNKEEPER_OPERATION="$request" npm run --silent retry
            else
              env -u GH_TOKEN -u GITHUB_TOKEN TAVERNKEEPER_OPERATION='{"operation":"resume"}' npm run --silent retry
            fi
          }

          gh auth setup-git
          git config user.name "TavernKeeper"
          git config user.email "tavernkeeper@users.noreply.github.com"
          push_succeeded="false"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            run_operation
            git add operations/state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(ops): apply staff queue operation"
            fi
            if git push origin HEAD:main; then
              push_succeeded="true"
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 15))"
            fi
          done
          test "$push_succeeded" = "true"
      - name: Dispatch reconcile
        if: ${{ inputs.operation != 'pause' && inputs.operation != 'revoke' && inputs.operation != 'migrate' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main

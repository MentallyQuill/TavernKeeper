name: Reconcile report deployment

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: tavernkeeper-pages-reconcile
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy_required: ${{ steps.compare.outputs.deploy_required }}
      source_sha: ${{ steps.compare.outputs.source_sha }}
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Compare committed and deployed source commits
        id: compare
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          deployed_source=""
          if curl --fail --silent --show-error --location --max-redirs 0 \
            --output "$RUNNER_TEMP/deployment-source.txt" \
            "https://mentallyquill.github.io/TavernKeeper/deployment-source.txt"; then
            deployed_source="$(tr -d '\r\n' < "$RUNNER_TEMP/deployment-source.txt")"
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [[ "$deployed_source" = "$source_sha" ]]; then
            echo "deploy_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: ${{ needs.check.outputs.deploy_required == 'true' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      source_sha: ${{ needs.check.outputs.source_sha }}
      automatic: true
    secrets: inherit

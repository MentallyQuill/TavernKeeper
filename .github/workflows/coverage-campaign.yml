name: One-time top and latest-release coverage

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tavernkeeper-global-scan
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    environment: tavernkeeper-staff
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Select fixed one-time coverage campaign
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run --silent coverage-campaign
      - name: Create TavernKeeper Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNKEEPER_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_PRIVATE_KEY }}
          owner: MentallyQuill
          repositories: TavernKeeper
          permission-contents: write
      - name: Commit fixed coverage campaign
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          SELECTION_TOKEN: ${{ github.token }}
        run: |
          run_operation() {
            env -u GH_TOKEN GITHUB_TOKEN="$SELECTION_TOKEN" npm run --silent coverage-campaign
          }
          commit_campaign() {
            if git diff --quiet -- operations/state.json; then
              return 1
            fi
            git add operations/state.json
            git commit -m "chore(scans): schedule one-time coverage"
          }

          gh auth setup-git
          git config user.name "TavernKeeper"
          git config user.email "tavernkeeper@users.noreply.github.com"
          push_succeeded="false"
          if ! commit_campaign; then
            push_succeeded="true"
          else
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                push_succeeded="true"
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep "$((attempt * 15))"
                env -u GH_TOKEN GITHUB_TOKEN="$SELECTION_TOKEN" git fetch origin main
                git reset --hard origin/main
                run_operation
                if ! commit_campaign; then
                  push_succeeded="true"
                  break
                fi
              fi
            done
          fi
          test "$push_succeeded" = "true"
      - name: Dispatch backlog reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main

name: Reconcile scan backlog

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: [tavernary-targets-updated]

concurrency:
  group: tavernkeeper-global-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      requests_json: ${{ steps.plan.outputs.requests_json }}
      remaining: ${{ steps.plan.outputs.remaining }}
      deploy_required: ${{ steps.plan.outputs.deploy_required }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Plan deployment recovery or bounded batch
        id: plan
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          expected="$(sha256sum reports/index.json | cut -d' ' -f1)"
          actual=""
          if curl --fail --silent --show-error --location --max-redirs 0 \
            --output "$RUNNER_TEMP/live-index.json" \
            "https://mentallyquill.github.io/TavernKeeper/reports/index.json"; then
            actual="$(sha256sum "$RUNNER_TEMP/live-index.json" | cut -d' ' -f1)"
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [[ "$actual" != "$expected" ]]; then
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            echo 'requests_json=[]' >> "$GITHUB_OUTPUT"
            echo 'remaining=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy_required=false" >> "$GITHUB_OUTPUT"
          planned="$(npm run --silent reconcile)"
          echo "requests_json=$(jq -c '.include' <<< "$planned")" >> "$GITHUB_OUTPUT"
          echo "remaining=$(jq -r '.remaining' <<< "$planned")" >> "$GITHUB_OUTPUT"

  recover-pages:
    needs: plan
    if: ${{ needs.plan.outputs.deploy_required == 'true' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
    secrets: inherit

  run:
    needs: plan
    if: ${{ needs.plan.outputs.deploy_required == 'false' && fromJSON(needs.plan.outputs.requests_json)[0] != null }}
    uses: ./.github/workflows/scan-and-publish.yml
    with:
      requests_json: ${{ needs.plan.outputs.requests_json }}
      remaining: ${{ needs.plan.outputs.remaining }}
      continue_backlog: true
    secrets: inherit

  resume-after-recovery:
    needs: recover-pages
    if: ${{ needs.recover-pages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Resume reconciliation after verified deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main

name: Reconcile scan backlog

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: [tavernary-targets-updated]

concurrency:
  group: tavernkeeper-global-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      requests_json: ${{ steps.plan.outputs.requests_json }}
      total_remaining: ${{ steps.plan.outputs.total_remaining }}
      runnable_remaining: ${{ steps.plan.outputs.runnable_remaining }}
      delayed_retries: ${{ steps.plan.outputs.delayed_retries }}
      shared_holds: ${{ steps.plan.outputs.shared_holds }}
      primary_remaining: ${{ steps.plan.outputs.primary_remaining }}
      automatic_retries: ${{ steps.plan.outputs.automatic_retries }}
      manual_quarantines: ${{ steps.plan.outputs.manual_quarantines }}
      exhausted_targets: ${{ steps.plan.outputs.exhausted_targets }}
      next_wake_at: ${{ steps.plan.outputs.next_wake_at }}
      blocked: ${{ steps.plan.outputs.blocked }}
      deploy_required: ${{ steps.plan.outputs.deploy_required }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Plan deployment recovery or bounded batch
        id: plan
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          expected="$(sha256sum reports/index.json | cut -d' ' -f1)"
          actual=""
          if curl --fail --silent --show-error --location --max-redirs 0 \
            --output "$RUNNER_TEMP/live-index.json" \
            "https://mentallyquill.github.io/TavernKeeper/reports/index.json"; then
            actual="$(sha256sum "$RUNNER_TEMP/live-index.json" | cut -d' ' -f1)"
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [[ "$actual" != "$expected" ]]; then
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            echo 'requests_json=[]' >> "$GITHUB_OUTPUT"
            echo 'total_remaining=0' >> "$GITHUB_OUTPUT"
            echo 'runnable_remaining=0' >> "$GITHUB_OUTPUT"
            echo 'delayed_retries=0' >> "$GITHUB_OUTPUT"
            echo 'shared_holds=0' >> "$GITHUB_OUTPUT"
            echo 'primary_remaining=0' >> "$GITHUB_OUTPUT"
            echo 'automatic_retries=0' >> "$GITHUB_OUTPUT"
            echo 'manual_quarantines=0' >> "$GITHUB_OUTPUT"
            echo 'exhausted_targets=0' >> "$GITHUB_OUTPUT"
            echo 'next_wake_at=' >> "$GITHUB_OUTPUT"
            echo 'blocked=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy_required=false" >> "$GITHUB_OUTPUT"
          planned="$(npm run --silent reconcile)"
          echo "requests_json=$(jq -c '.include' <<< "$planned")" >> "$GITHUB_OUTPUT"
          echo "total_remaining=$(jq -er '.total_remaining | select(type == "number")' <<< "$planned")" >> "$GITHUB_OUTPUT"
          echo "runnable_remaining=$(jq -er '.runnable_remaining | select(type == "number")' <<< "$planned")" >> "$GITHUB_OUTPUT"
          echo "delayed_retries=$(jq -er '.delayed_retries | select(type == "number")' <<< "$planned")" >> "$GITHUB_OUTPUT"
          echo "shared_holds=$(jq -er '.shared_holds | select(type == "number")' <<< "$planned")" >> "$GITHUB_OUTPUT"
          echo "primary_remaining=$(jq -er '.primary_remaining | select(type == "number")' <<< "$planned")" >> "$GITHUB_OUTPUT"
          echo "automatic_retries=$(jq -er '.automatic_retries | select(type == "number")' <<< "$planned")" >> "$GITHUB_OUTPUT"
          echo "manual_quarantines=$(jq -er '.manual_quarantines | select(type == "number")' <<< "$planned")" >> "$GITHUB_OUTPUT"
          echo "exhausted_targets=$(jq -er '.exhausted_targets | select(type == "number")' <<< "$planned")" >> "$GITHUB_OUTPUT"
          echo "next_wake_at=$(jq -r '.next_wake_at // ""' <<< "$planned")" >> "$GITHUB_OUTPUT"
          echo "blocked=$(jq -er '.blocked | select(type == "boolean") | tostring' <<< "$planned")" >> "$GITHUB_OUTPUT"
          {
            echo "### TavernKeeper queue"
            echo
            echo "- Total remaining after this batch: $(jq -r '.total_remaining' <<< "$planned")"
            echo "- Runnable remaining after this batch: $(jq -r '.runnable_remaining' <<< "$planned")"
            echo "- Delayed retries: $(jq -r '.delayed_retries' <<< "$planned")"
            echo "- Shared holds: $(jq -r '.shared_holds' <<< "$planned")"
            echo "- Primary remaining after this batch: $(jq -r '.primary_remaining' <<< "$planned")"
            echo "- Automatic target retries: $(jq -r '.automatic_retries' <<< "$planned")"
            echo "- Manual target quarantines: $(jq -r '.manual_quarantines' <<< "$planned")"
            echo "- Exhausted exact targets: $(jq -r '.exhausted_targets' <<< "$planned")"
            echo "- Next automatic wake: $(jq -r '.next_wake_at // "none"' <<< "$planned")"
          } >> "$GITHUB_STEP_SUMMARY"

  recover-pages:
    needs: plan
    if: ${{ needs.plan.outputs.deploy_required == 'true' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      automatic: true
    secrets: inherit

  run:
    needs: plan
    if: ${{ needs.plan.outputs.deploy_required == 'false' && fromJSON(needs.plan.outputs.requests_json)[0] != null }}
    uses: ./.github/workflows/scan-and-publish.yml
    with:
      requests_json: ${{ needs.plan.outputs.requests_json }}
      total_remaining: ${{ needs.plan.outputs.total_remaining }}
      runnable_remaining: ${{ needs.plan.outputs.runnable_remaining }}
    secrets: inherit

  resume-after-recovery:
    needs: recover-pages
    if: ${{ needs.recover-pages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Resume reconciliation after verified deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main

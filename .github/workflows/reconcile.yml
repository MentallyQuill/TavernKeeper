name: Reconcile scan backlog

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
    inputs:
      force_provider_probe:
        description: Probe the configured provider before its current cooldown expires
        type: boolean
        required: false
        default: false
  workflow_call:
  repository_dispatch:
    types: [tavernary-targets-updated]

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
  actions: write

jobs:
  claim:
    runs-on: ubuntu-latest
    environment: tavernkeeper-scanner
    permissions:
      contents: read
      actions: write
      issues: write
    outputs:
      requests_json: ${{ steps.claim.outputs.requests_json }}
      total_remaining: ${{ steps.claim.outputs.total_remaining }}
      runnable_remaining: ${{ steps.claim.outputs.runnable_remaining }}
      delayed_entries: ${{ steps.claim.outputs.delayed_entries }}
      next_wake_at: ${{ steps.claim.outputs.next_wake_at }}
      emergency_stopped: ${{ steps.claim.outputs.emergency_stopped }}
      automatic_holds: ${{ steps.claim.outputs.automatic_holds }}
      recovery_probes: ${{ steps.claim.outputs.recovery_probes }}
      provider_probe_fingerprint: ${{ steps.claim.outputs.provider_probe_fingerprint }}
      active_scans: ${{ steps.claim.outputs.active_scans }}
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create TavernKeeper Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNKEEPER_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_PRIVATE_KEY }}
          owner: MentallyQuill
          repositories: TavernKeeper
          permission-contents: write
      - name: Claim and commit available scan slots
        id: claim
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          TAVERNKEEPER_CLAIM_RUN_ID: actions-${{ github.run_id }}-${{ github.run_attempt }}
          TAVERNKEEPER_FORCE_PROVIDER_PROBE: ${{ github.event.inputs.force_provider_probe || 'false' }}
        shell: bash
        run: |
          run_claim() {
            claim_result="$(env -u GH_TOKEN -u GITHUB_TOKEN npm run --silent queue:claim)"
          }
          commit_claim() {
            git add operations/state.json
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m "chore(ops): claim scan slots"
          }

          gh auth setup-git
          git config user.name "TavernKeeper"
          git config user.email "tavernkeeper@users.noreply.github.com"
          push_succeeded="false"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            run_claim
            if ! commit_claim; then
              push_succeeded="true"
              break
            fi
            if git push origin HEAD:main; then
              push_succeeded="true"
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 15))"
            fi
          done
          test "$push_succeeded" = "true"

          echo "requests_json=$(jq -c '.include' <<< "$claim_result")" >> "$GITHUB_OUTPUT"
          echo "total_remaining=$(jq -er '.total_remaining | select(type == "number")' <<< "$claim_result")" >> "$GITHUB_OUTPUT"
          echo "runnable_remaining=$(jq -er '.runnable_remaining | select(type == "number")' <<< "$claim_result")" >> "$GITHUB_OUTPUT"
          echo "delayed_entries=$(jq -er '.delayed_entries | select(type == "number")' <<< "$claim_result")" >> "$GITHUB_OUTPUT"
          echo "next_wake_at=$(jq -r '.next_wake_at // ""' <<< "$claim_result")" >> "$GITHUB_OUTPUT"
          echo "emergency_stopped=$(jq -er '.emergency_stopped | select(type == "boolean") | tostring' <<< "$claim_result")" >> "$GITHUB_OUTPUT"
          echo "automatic_holds=$(jq -er '.automatic_holds | select(type == "number")' <<< "$claim_result")" >> "$GITHUB_OUTPUT"
          echo "recovery_probes=$(jq -er '.recovery_probes | select(type == "number")' <<< "$claim_result")" >> "$GITHUB_OUTPUT"
          echo "provider_probe_fingerprint=$(jq -r '.provider_probe_fingerprint // ""' <<< "$claim_result")" >> "$GITHUB_OUTPUT"
          echo "active_scans=$(jq -er '.active_scans | select(type == "number")' <<< "$claim_result")" >> "$GITHUB_OUTPUT"
          {
            echo "### TavernKeeper durable scan slots"
            echo
            echo "- Active scans: $(jq -r '.active_scans' <<< "$claim_result") / 2"
            echo "- Claimed now: $(jq -r '.include | length' <<< "$claim_result")"
            echo "- Remaining after claims: $(jq -r '.total_remaining' <<< "$claim_result")"
            echo "- Runnable after claims: $(jq -r '.runnable_remaining' <<< "$claim_result")"
            echo "- Cooling entries: $(jq -r '.delayed_entries' <<< "$claim_result")"
            echo "- Expired claims recovered: $(jq -r '.expired_claims' <<< "$claim_result")"
            echo "- Staff emergency stop: $(jq -r '.emergency_stopped' <<< "$claim_result")"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reconcile secret-free operational incidents
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/reconcile-operational-incidents.sh
      - name: Schedule deterministic delayed wake
        if: ${{ fromJSON(steps.claim.outputs.requests_json)[0] == null && steps.claim.outputs.total_remaining != '0' && steps.claim.outputs.next_wake_at != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAVERNKEEPER_WAKE_AT: ${{ steps.claim.outputs.next_wake_at }}
        shell: bash
        run: gh workflow run delayed-wake.yml --repo "$GITHUB_REPOSITORY" --ref main -f wake_at="$TAVERNKEEPER_WAKE_AT"

  probe-provider:
    needs: claim
    if: ${{ needs.claim.outputs.provider_probe_fingerprint != '' }}
    runs-on: ubuntu-latest
    environment: tavernkeeper-scanner
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out synchronized TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check benign provider compatibility
        id: provider_check
        continue-on-error: true
        timeout-minutes: 5
        env:
          TAVERNKEEPER_API_ENDPOINT: ${{ secrets.TAVERNKEEPER_API_ENDPOINT }}
          TAVERNKEEPER_API_KEY: ${{ secrets.TAVERNKEEPER_API_KEY }}
          TAVERNKEEPER_MODEL: ${{ secrets.TAVERNKEEPER_MODEL }}
          TAVERNKEEPER_ERROR_OUTPUT: phase-error.json
        run: npm run --silent provider:check
      - name: Apply provider probe outcome
        id: apply_probe
        env:
          TAVERNKEEPER_PROBE_FINGERPRINT: ${{ needs.claim.outputs.provider_probe_fingerprint }}
          TAVERNKEEPER_PROBE_OUTCOME: ${{ steps.provider_check.outcome }}
        shell: bash
        run: |
          operation="provider-probe-failure"
          if [[ "$TAVERNKEEPER_PROBE_OUTCOME" = "success" ]] || npm run --silent probe-outcome -- phase-error.json >/dev/null 2>&1; then
            operation="provider-probe-success"
          fi
          probed_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          request="$(jq -nc --arg operation "$operation" --arg error_fingerprint "$TAVERNKEEPER_PROBE_FINGERPRINT" --arg probed_at "$probed_at" '{operation:$operation,error_fingerprint:$error_fingerprint,probed_at:$probed_at}')"
          echo "request=$request" >> "$GITHUB_OUTPUT"
          env -u GH_TOKEN -u GITHUB_TOKEN TAVERNKEEPER_OPERATION="$request" npm run --silent retry
      - name: Create TavernKeeper Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNKEEPER_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_PRIVATE_KEY }}
          owner: MentallyQuill
          repositories: TavernKeeper
          permission-contents: write
      - name: Commit provider recovery state
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          TAVERNKEEPER_OPERATION: ${{ steps.apply_probe.outputs.request }}
        shell: bash
        run: |
          run_operation() {
            env -u GH_TOKEN -u GITHUB_TOKEN npm run --silent retry
          }
          gh auth setup-git
          git config user.name "TavernKeeper"
          git config user.email "tavernkeeper@users.noreply.github.com"
          git add operations/state.json
          git diff --cached --quiet && exit 1
          git commit -m "chore(ops): record provider recovery probe"
          push_succeeded="false"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              push_succeeded="true"
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 15))"
              git fetch origin main
              git reset --hard origin/main
              run_operation
              git add operations/state.json
              if git diff --cached --quiet; then
                push_succeeded="true"
                break
              fi
              git commit -m "chore(ops): record provider recovery probe"
            fi
          done
          test "$push_succeeded" = "true"
      - name: Dispatch backlog reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main

  run:
    needs: claim
    if: ${{ fromJSON(needs.claim.outputs.requests_json)[0] != null }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        request: ${{ fromJSON(needs.claim.outputs.requests_json) }}
    uses: ./.github/workflows/scan-and-publish.yml
    with:
      request_json: ${{ toJSON(matrix.request) }}
    secrets: inherit

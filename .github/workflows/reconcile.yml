name: Reconcile scan backlog

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: [tavernary-targets-updated]

concurrency:
  group: tavernkeeper-global-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      requests_json: ${{ steps.plan.outputs.requests_json }}
      remaining: ${{ steps.plan.outputs.remaining }}
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Plan bounded batch
        id: plan
        shell: bash
        run: |
          planned="$(npm run --silent reconcile)"
          echo "requests_json=$(jq -c '.include' <<< "$planned")" >> "$GITHUB_OUTPUT"
          echo "remaining=$(jq -r '.remaining' <<< "$planned")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.requests_json)[0] != null }}
    uses: ./.github/workflows/scan-and-publish.yml
    with:
      requests_json: ${{ needs.plan.outputs.requests_json }}
      remaining: ${{ needs.plan.outputs.remaining }}
      continue_backlog: true
    secrets: inherit

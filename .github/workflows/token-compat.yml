name: "Temporary: Prove opaque Tavernary and Publisher tokens"

run-name: "Temporary: Tavernary and Publisher tokens (${{ inputs.format }})"

on:
  workflow_dispatch:
    inputs:
      format:
        description: GitHub installation-token response format
        required: true
        type: choice
        options:
          - enabled
          - disabled

permissions:
  contents: read

jobs:
  prove:
    environment: tavernkeeper-scanner
    runs-on: ubuntu-latest
    steps:
      - name: Check out TavernKeeper without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mint and consume wake and Publisher tokens opaquely
        env:
          FORMAT: ${{ inputs.format }}
          PUBLISHER_APP_ID: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_ID }}
          PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_PRIVATE_KEY }}
          WAKE_APP_ID: ${{ secrets.TAVERNARY_WAKE_APP_ID }}
          WAKE_APP_PRIVATE_KEY: ${{ secrets.TAVERNARY_WAKE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [[ "$FORMAT" == "enabled" || "$FORMAT" == "disabled" ]]

          base64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          mint_token() {
            local app_id="$1"
            local private_key="$2"
            local repository="$3"
            local permissions="$4"
            local now header payload unsigned signature jwt installation_id request

            now="$(date +%s)"
            header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | base64url)"
            payload="$(jq -nc --argjson iat "$((now - 60))" --argjson exp "$((now + 540))" --arg iss "$app_id" '{iat:$iat,exp:$exp,iss:$iss}' | base64url)"
            unsigned="$header.$payload"
            signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign <(printf '%s' "$private_key") -binary | base64url)"
            jwt="$unsigned.$signature"
            echo "::add-mask::$jwt"

            installation_id="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $jwt" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/MentallyQuill/$repository/installation" | jq -er '.id')"
            request="$(jq -nc --arg repository "$repository" --argjson permissions "$permissions" '{repositories:[$repository],permissions:$permissions}')"
            MINTED_TOKEN="$(curl --fail --silent --show-error --request POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $jwt" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "X-GitHub-Stateless-S2S-Token: $FORMAT" \
              -d "$request" \
              "https://api.github.com/app/installations/$installation_id/access_tokens" | jq -er '.token')"
            echo "::add-mask::$MINTED_TOKEN"
          }

          mint_token "$WAKE_APP_ID" "$WAKE_APP_PRIVATE_KEY" Tavernary '{"actions":"write"}'
          wake_token="$MINTED_TOKEN"
          jq -nc --arg format "$FORMAT" '{ref:"main",inputs:{format:$format}}' | \
            GH_TOKEN="$wake_token" gh api --method POST \
              repos/MentallyQuill/Tavernary/actions/workflows/tavernkeeper-token-compat-receiver.yml/dispatches \
              --input -
          unset wake_token MINTED_TOKEN

          mint_token "$PUBLISHER_APP_ID" "$PUBLISHER_APP_PRIVATE_KEY" TavernKeeper '{"contents":"write"}'
          export GH_TOKEN="$MINTED_TOKEN"
          gh auth setup-git
          git push --dry-run origin HEAD:main
          unset GH_TOKEN MINTED_TOKEN
          echo "format=$FORMAT actor_id=$GITHUB_ACTOR_ID"

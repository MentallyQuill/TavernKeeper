name: Tavernary targeted scan

run-name: "Tavernary targeted scan #${{ inputs.repository_id }}"

on:
  workflow_dispatch:
    inputs:
      repository_id:
        description: Tavernary GitHub repository ID
        type: number
        required: true

permissions:
  contents: read
  actions: write

jobs:
  enqueue:
    if: ${{ github.actor_id == vars.TAVERNARY_WAKE_APP_BOT_ID }}
    runs-on: ubuntu-latest
    environment: tavernkeeper-scanner
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Synchronize and enqueue the authorized target
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          TAVERNKEEPER_TARGETED_SCAN: '{"repository_id":${{ inputs.repository_id }}}'
          TAVERNARY_TARGET_MANIFEST: https://tavernary.org/security/tavernkeeper-targets.json
        shell: bash
        run: |
          created_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)"
          queued="$(TAVERNKEEPER_REQUEST_CREATED_AT="$created_at" npm run --silent targeted-scan)"
          printf '%s\n' "$queued"
          echo "accepted=$(jq -r '.accepted' <<< "$queued")" >> "$GITHUB_OUTPUT"
          echo "changed=$(jq -r '.changed' <<< "$queued")" >> "$GITHUB_OUTPUT"
      - name: Create TavernKeeper Publisher token
        id: publisher-token
        if: ${{ steps.request.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_PRIVATE_KEY }}
          owner: MentallyQuill
          repositories: TavernKeeper
          permission-contents: write
      - name: Commit targeted queue entry
        if: ${{ steps.request.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        shell: bash
        run: |
          gh auth setup-git
          git config user.name "TavernKeeper"
          git config user.email "tavernkeeper@users.noreply.github.com"
          git add operations/state.json
          git commit -m "chore(ops): enqueue targeted scan"
          push_succeeded="false"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              push_succeeded="true"
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 15))"
            fi
          done
          test "$push_succeeded" = "true"
      - name: Enter the normal durable queue
        if: ${{ steps.request.outputs.accepted == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main

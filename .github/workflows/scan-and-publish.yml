name: Scan and publish

on:
  workflow_call:
    inputs:
      requests_json:
        type: string
        required: true
      total_remaining:
        type: string
        required: false
        default: "0"
      runnable_remaining:
        type: string
        required: false
        default: "0"
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
  actions: write

jobs:
  scan:
    if: ${{ fromJSON(inputs.requests_json)[0] != null }}
    runs-on: ubuntu-latest
    environment: tavernkeeper-scanner
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        request: ${{ fromJSON(inputs.requests_json) }}
    steps:
      - name: Initialize encrypted bootstrap failure
        env:
          TAVERNKEEPER_ARTIFACT_KEY: ${{ secrets.TAVERNKEEPER_ARTIFACT_KEY }}
          TAVERNKEEPER_SCAN_REQUEST: ${{ toJSON(matrix.request) }}
          TAVERNKEEPER_BOOTSTRAP_OUTCOME: ${{ runner.temp }}/tavernkeeper-outcome-${{ matrix.request.repository_id }}.enc
        shell: bash
        run: |
          node <<'NODE'
          const { createCipheriv, randomBytes } = require("node:crypto");
          const { writeFileSync } = require("node:fs");

          const request = JSON.parse(process.env.TAVERNKEEPER_SCAN_REQUEST);
          const target = Object.fromEntries(
            [
              "source_id",
              "provider",
              "repository_id",
              "repository",
              "target_sha",
              "canonical_url",
            ].map((key) => [key, request[key]]),
          );
          const payload = {
            schema_version: 1,
            candidate: null,
            transition: {
              schema_version: 2,
              status: "failure",
              target,
              failure: {
                code: "SCAN_BOOTSTRAP_FAILED",
                domain: "shared",
                component: "orchestrator",
              },
              at: new Date().toISOString(),
            },
          };
          const encodedKey = process.env.TAVERNKEEPER_ARTIFACT_KEY;
          if (!/^[A-Za-z0-9+/]{43}=$/.test(encodedKey)) {
            throw new Error("Artifact encryption key is invalid.");
          }
          const key = Buffer.from(encodedKey, "base64");
          if (key.length !== 32) {
            throw new Error("Artifact encryption key is invalid.");
          }
          const magic = Buffer.from("TKAT1", "ascii");
          const nonce = randomBytes(12);
          const cipher = createCipheriv("aes-256-gcm", key, nonce);
          cipher.setAAD(magic);
          const ciphertext = Buffer.concat([
            cipher.update(Buffer.from(JSON.stringify(payload), "utf8")),
            cipher.final(),
          ]);
          writeFileSync(
            process.env.TAVERNKEEPER_BOOTSTRAP_OUTCOME,
            Buffer.concat([magic, nonce, cipher.getAuthTag(), ciphertext]),
            { flag: "wx" },
          );
          NODE
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: dependencies
        continue-on-error: true
        run: npm ci
      - name: Install and verify pinned scanners
        id: toolchain
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npm run scanners:install
          npm run scanners:verify
          echo "$RUNNER_TEMP/tavernkeeper-tools-v1/bin" >> "$GITHUB_PATH"
      - name: Record shared scanner toolchain failure
        if: ${{ steps.dependencies.outcome == 'success' && steps.toolchain.outcome == 'failure' }}
        shell: bash
        run: |
          node -e 'require("node:fs").writeFileSync("phase-error.json", JSON.stringify({code:"SCANNER_UNAVAILABLE",domain:"shared",component:"orchestrator"}) + "\n", {flag:"wx"})'
      - name: Prepare exact target and scanner evidence
        id: prepare
        if: ${{ steps.dependencies.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        continue-on-error: true
        env:
          TAVERNKEEPER_SCAN_REQUEST: ${{ toJSON(matrix.request) }}
          TAVERNKEEPER_CHECKOUT_ROOT: ${{ runner.temp }}/tavernkeeper-checkout-${{ matrix.request.repository_id }}
          TAVERNKEEPER_SESSION_ROOT: ${{ runner.temp }}/tavernkeeper-session-${{ matrix.request.repository_id }}
          TAVERNKEEPER_ERROR_OUTPUT: phase-error.json
        run: npm run --silent prepare-target
      - name: Contextually assess scanner evidence
        id: review
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        env:
          TAVERNKEEPER_API_ENDPOINT: ${{ secrets.TAVERNKEEPER_API_ENDPOINT }}
          TAVERNKEEPER_API_KEY: ${{ secrets.TAVERNKEEPER_API_KEY }}
          TAVERNKEEPER_MODEL: ${{ secrets.TAVERNKEEPER_MODEL }}
          TAVERNKEEPER_CHECKOUT_ROOT: ${{ runner.temp }}/tavernkeeper-checkout-${{ matrix.request.repository_id }}
          TAVERNKEEPER_SESSION_ROOT: ${{ runner.temp }}/tavernkeeper-session-${{ matrix.request.repository_id }}
          TAVERNKEEPER_ERROR_OUTPUT: phase-error.json
        run: npm run --silent review-target
      - name: Finalize contextual V5 report
        id: finalize
        if: steps.review.outcome == 'success'
        continue-on-error: true
        env:
          TAVERNKEEPER_CHECKOUT_ROOT: ${{ runner.temp }}/tavernkeeper-checkout-${{ matrix.request.repository_id }}
          TAVERNKEEPER_SESSION_ROOT: ${{ runner.temp }}/tavernkeeper-session-${{ matrix.request.repository_id }}
          TAVERNKEEPER_ERROR_OUTPUT: phase-error.json
        run: npm run --silent finalize-target -- candidate.json
      - name: Record secret-free phase transition
        id: transition
        if: always()
        env:
          TAVERNKEEPER_SCAN_REQUEST: ${{ toJSON(matrix.request) }}
        shell: bash
        run: |
          npm run --silent transition-result -- candidate.json transition.json phase-error.json
          echo "scan_failure=$(jq -r '.status == "failure"' transition.json)" >> "$GITHUB_OUTPUT"
      - name: Encrypt sanitized outcome
        if: always()
        env:
          TAVERNKEEPER_ARTIFACT_KEY: ${{ secrets.TAVERNKEEPER_ARTIFACT_KEY }}
        shell: bash
        run: |
          npm run --silent artifact-transport -- encrypt outcome-actual.enc candidate.json transition.json
          mv outcome-actual.enc "${{ runner.temp }}/tavernkeeper-outcome-${{ matrix.request.repository_id }}.enc"
      - name: Remove plaintext handoff files
        if: always()
        shell: bash
        run: rm -f candidate.json transition.json phase-error.json
      - name: Upload encrypted scan outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-${{ matrix.request.repository_id }}
          path: ${{ runner.temp }}/tavernkeeper-outcome-${{ matrix.request.repository_id }}.enc
          if-no-files-found: error
          retention-days: 1
      - name: Mark this repository failed after a recorded scan failure
        if: ${{ steps.transition.outputs.scan_failure == 'true' }}
        run: exit 1

  publish:
    needs: scan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: tavernkeeper-scanner
    permissions:
      contents: read
      issues: write
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
      reports: ${{ steps.publish.outputs.reports }}
      target_failures: ${{ steps.publish.outputs.target_failures }}
      shared_holds: ${{ steps.publish.outputs.shared_holds }}
      security_holds: ${{ steps.publish.outputs.security_holds }}
      continuation_blocked: ${{ steps.publish.outputs.continuation_blocked }}
      terminal_failures: ${{ steps.publish.outputs.terminal_failures }}
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download encrypted outcomes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scan-*
          path: encrypted-artifacts
      - name: Decrypt sanitized outcomes
        env:
          TAVERNKEEPER_ARTIFACT_KEY: ${{ secrets.TAVERNKEEPER_ARTIFACT_KEY }}
          TAVERNKEEPER_SCAN_REQUESTS: ${{ inputs.requests_json }}
        shell: bash
        run: |
          expected="$(jq -er 'if type == "array" and length > 0 then length else error("invalid scan request batch") end' <<< "$TAVERNKEEPER_SCAN_REQUESTS")"
          position=0
          while IFS= read -r -d '' artifact; do
            npm run --silent artifact-transport -- decrypt "$artifact" "artifacts/scan-$position"
            position=$((position + 1))
          done < <(find encrypted-artifacts -type f -name 'tavernkeeper-outcome-*.enc' -print0)
          test "$position" -eq "$expected"
      - name: Publish serialized batch
        id: publish
        env:
          TAVERNKEEPER_SCAN_REQUESTS: ${{ inputs.requests_json }}
        shell: bash
        run: |
          result="$(npm run --silent publish -- artifacts)"
          printf '%s\n' "$result"
          reports="$(jq -er '.reports | select(type == "number")' <<< "$result")"
          target_failures="$(jq -er '.target_failures | select(type == "number")' <<< "$result")"
          shared_holds="$(jq -er '.shared_holds | select(type == "number")' <<< "$result")"
          security_holds="$(jq -er '.security_holds | select(type == "number")' <<< "$result")"
          continuation_blocked="$(jq -er '.continuation_blocked | select(type == "boolean") | tostring' <<< "$result")"
          terminal_failures="$(jq -er '.terminal_failures | select(type == "number")' <<< "$result")"
          printf 'reports=%s\n' "$reports" >> "$GITHUB_OUTPUT"
          printf 'target_failures=%s\n' "$target_failures" >> "$GITHUB_OUTPUT"
          printf 'shared_holds=%s\n' "$shared_holds" >> "$GITHUB_OUTPUT"
          printf 'security_holds=%s\n' "$security_holds" >> "$GITHUB_OUTPUT"
          printf 'continuation_blocked=%s\n' "$continuation_blocked" >> "$GITHUB_OUTPUT"
          printf 'terminal_failures=%s\n' "$terminal_failures" >> "$GITHUB_OUTPUT"
      - name: Reconcile secret-free operational incidents
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          incidents="$(npm run --silent exhausted)"
          gh label create scanner-operations --color B60205 --description "TavernKeeper operational incidents" --force
          gh label create scanner-recovery --color D4C5F9 --description "TavernKeeper automatic recovery probes" --force

          jq -c '.target_exhaustions[]' <<< "$incidents" | while read -r failure; do
            incident_key="$(jq -r '.target_incident_key' <<< "$failure")"
            fingerprint="$(jq -r '.error_fingerprint' <<< "$failure")"
            code="$(jq -r '.failure.code' <<< "$failure")"
            component="$(jq -r '.failure.component' <<< "$failure")"
            repository_id="$(jq -r '.repository_id' <<< "$failure")"
            target="$(jq -r '.target_sha' <<< "$failure")"
            history="$(jq -c '[.failure_history[] | {failed_at, code: .failure.code, component: .failure.component, diagnostic: (.failure.diagnostic // null)}]' <<< "$failure")"
            issues="$(gh issue list --state all --label scanner-operations --limit 100 --json number,createdAt,body)"
            existing="$(jq -r --arg incident "$incident_key" --arg repository_id "$repository_id" --arg target "$target" '
              map(select(
                (.body | contains("Target incident key: `" + $incident + "`")) or
                ((.body | contains("Repository ID: `" + $repository_id + "`")) and
                 (.body | contains("Target commit: `" + $target + "`")))
              ))
              | sort_by(.createdAt)
              | .[0].number // empty
            ' <<< "$issues")"
            if [[ -z "$existing" ]]; then
              gh issue create \
                --label scanner-operations \
                --title "[scanner-operations] target retry exhausted" \
                --body "TavernKeeper exhausted four queued attempts for one exact target.\n\nTarget incident key: \`$incident_key\`\nError fingerprint: \`$fingerprint\`\nCode: \`$code\`\nComponent: \`$component\`\nRepository ID: \`$repository_id\`\nTarget commit: \`$target\`\nFailure history: \`$history\`\n\nUnrelated catalog work continues automatically."
            fi
          done

          jq -c '.shared_holds[] | select(.notified)' <<< "$incidents" | while read -r hold; do
            fingerprint="$(jq -r '.error_fingerprint' <<< "$hold")"
            code="$(jq -r '.failure.code' <<< "$hold")"
            component="$(jq -r '.failure.component' <<< "$hold")"
            next_probe="$(jq -r '.next_probe_at' <<< "$hold")"
            existing="$(gh issue list --state open --label scanner-recovery --search "$fingerprint in:body" --json number --jq '.[0].number // empty')"
            if [[ -z "$existing" ]]; then
              gh issue create \
                --label scanner-recovery \
                --title "[scanner-recovery] shared dependency is retrying" \
                --body "TavernKeeper continues bounded automatic recovery probes.\n\nRecovery fingerprint: \`$fingerprint\`\nCode: \`$code\`\nComponent: \`$component\`\nNext probe: \`$next_probe\`"
            fi
          done

          gh issue list --state open --label scanner-recovery --limit 100 --json number,body --jq '.[] | @base64' | while read -r encoded; do
            issue="$(printf '%s' "$encoded" | base64 --decode)"
            number="$(jq -r '.number' <<< "$issue")"
            fingerprint="$(jq -r '.body | capture("Recovery fingerprint: `(?<value>[0-9a-f]{64})`").value // empty' <<< "$issue")"
            if [[ -n "$fingerprint" ]] && ! jq -e --arg fingerprint "$fingerprint" '.shared_holds[] | select(.error_fingerprint == $fingerprint)' <<< "$incidents" >/dev/null; then
              gh issue close "$number" --comment "Automatic recovery succeeded; this shared hold is no longer active."
            fi
          done

          jq -c '.security_holds[]' <<< "$incidents" | while read -r failure; do
            fingerprint="$(jq -r '.error_fingerprint' <<< "$failure")"
            code="$(jq -r '.failure.code' <<< "$failure")"
            component="$(jq -r '.failure.component' <<< "$failure")"
            existing="$(gh issue list --state open --label scanner-operations --search "$fingerprint in:body" --json number --jq '.[0].number // empty')"
            if [[ -z "$existing" ]]; then
              gh issue create \
                --label scanner-operations \
                --title "[scanner-operations] security hold requires repair" \
                --body "TavernKeeper paused safely for a trusted-boundary failure.\n\nError fingerprint: \`$fingerprint\`\nCode: \`$code\`\nComponent: \`$component\`\n\nRepair and verify the external condition, then resume through the protected staff workflow."
            fi
          done
      - name: Create TavernKeeper Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_PRIVATE_KEY }}
          owner: MentallyQuill
          repositories: TavernKeeper
          permission-contents: write
      - name: Commit reports and state
        id: commit
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        shell: bash
        run: |
          gh auth setup-git
          git config user.name "TavernKeeper"
          git config user.email "tavernkeeper@users.noreply.github.com"
          git add reports operations/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(reports): publish completed scans"
            push_succeeded="false"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                push_succeeded="true"
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep "$((attempt * 15))"
              fi
            done
            test "$push_succeeded" = "true"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      source_sha: ${{ needs.publish.outputs.source_sha }}
      automatic: true
    secrets: inherit

  incident:
    needs: [scan, publish]
    if: ${{ always() && needs.publish.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report bounded pipeline failure
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code="PUBLISH_PIPELINE_FAILED"
          component="publication"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create scanner-operations --color B60205 --description "TavernKeeper operational incidents" --force
          existing="$(gh issue list --state open --label scanner-operations --search "$code in:body" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "The bounded publication pipeline failed again: $run_url"
          else
            gh issue create \
              --label scanner-operations \
              --title "[scanner-operations] publication pipeline failed" \
              --body "TavernKeeper could not persist its sanitized batch outcome. No scan payload or secret is included.\n\nCode: \`$code\`\nComponent: \`$component\`\nRun: $run_url\n\nAutomatic schedules remain enabled; inspect and repair the trusted publication boundary."
          fi

  continue:
    needs: [publish, deploy]
    if: ${{ always() && needs.publish.result == 'success' && needs.deploy.result == 'success' && needs.publish.outputs.continuation_blocked != 'true' && inputs.total_remaining != '0' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Continue remaining backlog without inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main

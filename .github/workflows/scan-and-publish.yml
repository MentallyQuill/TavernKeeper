name: Scan and publish

on:
  workflow_call:
    inputs:
      request_json:
        type: string
        required: true
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
  actions: write

jobs:
  prepare:
    if: ${{ fromJSON(inputs.request_json) != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Initialize sanitized preparation failure
        env:
          TAVERNKEEPER_SCAN_REQUEST: ${{ inputs.request_json }}
          TAVERNKEEPER_PREPARED_ARTIFACT: ${{ runner.temp }}/tavernkeeper-prepared-${{ fromJSON(inputs.request_json).repository_id }}
        shell: bash
        run: |
          node <<'NODE'
          const { mkdirSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          const request = JSON.parse(process.env.TAVERNKEEPER_SCAN_REQUEST);
          const manifest = {
            schema_version: 1,
            request,
            status: "failed",
            failure: {
              code: "SCAN_BOOTSTRAP_FAILED",
              domain: "shared",
              component: "orchestrator",
            },
          };
          mkdirSync(process.env.TAVERNKEEPER_PREPARED_ARTIFACT);
          writeFileSync(
            join(
              process.env.TAVERNKEEPER_PREPARED_ARTIFACT,
              "manifest.json",
            ),
            JSON.stringify(manifest, null, 2) + "\n",
            { flag: "wx" },
          );
          NODE
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: dependencies
        continue-on-error: true
        run: npm ci
      - name: Install and verify pinned scanners
        id: toolchain
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npm run scanners:install
          npm run scanners:verify
          echo "$RUNNER_TEMP/tavernkeeper-tools-v1/bin" >> "$GITHUB_PATH"
      - name: Record shared scanner toolchain failure
        if: ${{ steps.dependencies.outcome == 'success' && steps.toolchain.outcome == 'failure' }}
        shell: bash
        run: |
          node -e 'require("node:fs").writeFileSync("phase-error.json", JSON.stringify({code:"SCANNER_UNAVAILABLE",domain:"shared",component:"orchestrator"}) + "\n", {flag:"wx"})'
      - name: Prepare exact target and scanner evidence
        id: prepare
        if: ${{ steps.dependencies.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        continue-on-error: true
        env:
          TAVERNKEEPER_SCAN_REQUEST: ${{ inputs.request_json }}
          TAVERNKEEPER_CHECKOUT_ROOT: ${{ runner.temp }}/tavernkeeper-checkout-${{ fromJSON(inputs.request_json).repository_id }}
          TAVERNKEEPER_SESSION_ROOT: ${{ runner.temp }}/tavernkeeper-session-${{ fromJSON(inputs.request_json).repository_id }}
          TAVERNKEEPER_ERROR_OUTPUT: phase-error.json
        run: npm run --silent prepare-target
      - name: Package bounded prepared evidence
        id: pack
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        env:
          TAVERNKEEPER_SCAN_REQUEST: ${{ inputs.request_json }}
          TAVERNKEEPER_SESSION_ROOT: ${{ runner.temp }}/tavernkeeper-session-${{ fromJSON(inputs.request_json).repository_id }}
          TAVERNKEEPER_PREPARED_ARTIFACT: ${{ runner.temp }}/tavernkeeper-prepared-${{ fromJSON(inputs.request_json).repository_id }}
          TAVERNKEEPER_ERROR_OUTPUT: phase-error.json
        shell: bash
        run: |
          prepared_bytes="$(stat -c '%s' "$TAVERNKEEPER_SESSION_ROOT/prepared.json")"
          evidence_bytes="$(stat -c '%s' "$TAVERNKEEPER_SESSION_ROOT/evidence-context.json")"
          jq -nc \
            --argjson prepared_bytes "$prepared_bytes" \
            --argjson evidence_bytes "$evidence_bytes" \
            '{prepared_bytes:$prepared_bytes,evidence_bytes:$evidence_bytes,payload_bytes:($prepared_bytes + $evidence_bytes)}'
          npm run --silent prepared-evidence -- pack "$TAVERNKEEPER_SESSION_ROOT" "$TAVERNKEEPER_PREPARED_ARTIFACT"
      - name: Package sanitized preparation failure
        if: ${{ always() && steps.dependencies.outcome == 'success' && (steps.prepare.outcome != 'success' || steps.pack.outcome != 'success') }}
        env:
          TAVERNKEEPER_SCAN_REQUEST: ${{ inputs.request_json }}
          TAVERNKEEPER_PREPARED_ARTIFACT: ${{ runner.temp }}/tavernkeeper-prepared-${{ fromJSON(inputs.request_json).repository_id }}
        run: npm run --silent prepared-evidence -- fail phase-error.json "$TAVERNKEEPER_PREPARED_ARTIFACT"
      - name: Remove preparation diagnostics
        if: always()
        run: rm -f phase-error.json
      - name: Upload bounded prepared evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-${{ fromJSON(inputs.request_json).repository_id }}
          path: ${{ runner.temp }}/tavernkeeper-prepared-${{ fromJSON(inputs.request_json).repository_id }}
          if-no-files-found: error
          retention-days: 1
      - name: Mark failed preparation after preserving the handoff
        if: ${{ always() && (steps.prepare.outcome != 'success' || steps.pack.outcome != 'success') }}
        run: exit 1

  scan:
    needs: prepare
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: tavernkeeper-scanner
    permissions:
      contents: read
    steps:
      - name: Initialize encrypted bootstrap failure
        env:
          TAVERNKEEPER_ARTIFACT_KEY: ${{ secrets.TAVERNKEEPER_ARTIFACT_KEY }}
          TAVERNKEEPER_SCAN_REQUEST: ${{ inputs.request_json }}
          TAVERNKEEPER_BOOTSTRAP_OUTCOME: ${{ runner.temp }}/tavernkeeper-outcome-${{ fromJSON(inputs.request_json).repository_id }}.enc
        shell: bash
        run: |
          node <<'NODE'
          const { createCipheriv, randomBytes } = require("node:crypto");
          const { writeFileSync } = require("node:fs");

          const request = JSON.parse(process.env.TAVERNKEEPER_SCAN_REQUEST);
          const target = Object.fromEntries(
            [
              "source_id",
              "provider",
              "repository_id",
              "repository",
              "target_sha",
              "canonical_url",
            ].map((key) => [key, request[key]]),
          );
          const payload = {
            schema_version: 1,
            candidate: null,
            transition: {
              schema_version: 2,
              status: "failure",
              target,
              failure: {
                code: "SCAN_BOOTSTRAP_FAILED",
                domain: "shared",
                component: "orchestrator",
              },
              at: new Date().toISOString(),
            },
          };
          const encodedKey = process.env.TAVERNKEEPER_ARTIFACT_KEY;
          if (!/^[A-Za-z0-9+/]{43}=$/.test(encodedKey)) {
            throw new Error("Artifact encryption key is invalid.");
          }
          const key = Buffer.from(encodedKey, "base64");
          if (key.length !== 32) {
            throw new Error("Artifact encryption key is invalid.");
          }
          const magic = Buffer.from("TKAT1", "ascii");
          const nonce = randomBytes(12);
          const cipher = createCipheriv("aes-256-gcm", key, nonce);
          cipher.setAAD(magic);
          const ciphertext = Buffer.concat([
            cipher.update(Buffer.from(JSON.stringify(payload), "utf8")),
            cipher.final(),
          ]);
          writeFileSync(
            process.env.TAVERNKEEPER_BOOTSTRAP_OUTCOME,
            Buffer.concat([magic, nonce, cipher.getAuthTag(), ciphertext]),
            { flag: "wx" },
          );
          NODE
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: dependencies
        continue-on-error: true
        run: npm ci
      - name: Download bounded prepared evidence
        id: download
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-${{ fromJSON(inputs.request_json).repository_id }}
          path: ${{ runner.temp }}/tavernkeeper-prepared-${{ fromJSON(inputs.request_json).repository_id }}
      - name: Record unavailable prepared evidence
        if: ${{ steps.dependencies.outcome == 'success' && steps.download.outcome != 'success' }}
        run: node -e 'require("node:fs").writeFileSync("phase-error.json", JSON.stringify({code:"PREPARED_ARTIFACT_UNAVAILABLE",domain:"shared",component:"artifact-transport"}) + "\n", {flag:"wx"})'
      - name: Restore bounded prepared evidence
        id: restore
        if: ${{ steps.dependencies.outcome == 'success' && steps.download.outcome == 'success' }}
        continue-on-error: true
        env:
          TAVERNKEEPER_SCAN_REQUEST: ${{ inputs.request_json }}
          TAVERNKEEPER_SESSION_ROOT: ${{ runner.temp }}/tavernkeeper-session-${{ fromJSON(inputs.request_json).repository_id }}
          TAVERNKEEPER_PREPARED_ARTIFACT: ${{ runner.temp }}/tavernkeeper-prepared-${{ fromJSON(inputs.request_json).repository_id }}
          TAVERNKEEPER_ERROR_OUTPUT: phase-error.json
        shell: bash
        run: |
          result="$(npm run --silent prepared-evidence -- restore "$TAVERNKEEPER_PREPARED_ARTIFACT" "$TAVERNKEEPER_SESSION_ROOT" phase-error.json)"
          printf '%s\n' "$result"
          echo "prepared=$(jq -r '.status == "prepared"' <<< "$result")" >> "$GITHUB_OUTPUT"
      - name: Contextually assess scanner evidence
        id: review
        if: ${{ steps.restore.outcome == 'success' && steps.restore.outputs.prepared == 'true' }}
        continue-on-error: true
        timeout-minutes: 65
        env:
          TAVERNKEEPER_API_ENDPOINT: ${{ secrets.TAVERNKEEPER_API_ENDPOINT }}
          TAVERNKEEPER_API_KEY: ${{ secrets.TAVERNKEEPER_API_KEY }}
          TAVERNKEEPER_MODEL: ${{ secrets.TAVERNKEEPER_MODEL }}
          JSONREPAIR_API_ENDPOINT: ${{ secrets.JSONREPAIR_API_ENDPOINT }}
          JSONREPAIR_API_KEY: ${{ secrets.JSONREPAIR_API_KEY }}
          JSONREPAIR_MODEL: ${{ secrets.JSONREPAIR_MODEL }}
          TAVERNKEEPER_SESSION_ROOT: ${{ runner.temp }}/tavernkeeper-session-${{ fromJSON(inputs.request_json).repository_id }}
          TAVERNKEEPER_ERROR_OUTPUT: phase-error.json
        shell: bash
        run: |
          progress_count() {
            node scripts/contextual-review-progress-count.mjs "$TAVERNKEEPER_SESSION_ROOT/review-progress.json"
          }
          run_review() {
            rm -f review-result.json
            node -e 'require("node:fs").writeFileSync("phase-error.json", JSON.stringify({code:"MODEL_REVIEW_TIMEOUT",domain:"target",component:"contextual-model"}) + "\n", {flag:"wx"})'
            if timeout --signal=TERM --kill-after=5s 20m npm run --silent review-target > review-result.json; then
              rm -f phase-error.json
              return 0
            fi
            return 1
          }
          retryable_review_failure() {
            jq -e '(.code == "MODEL_PROVIDER" and .domain == "shared" and .component == "contextual-model") or (.code == "MODEL_QUOTA" and .domain == "shared" and .component == "contextual-model") or (.code == "MODEL_REVIEW_TIMEOUT" and .domain == "target" and .component == "contextual-model")' phase-error.json >/dev/null
          }
          provider_review_failure() {
            jq -e '.code == "MODEL_PROVIDER" and .domain == "shared" and .component == "contextual-model"' phase-error.json >/dev/null
          }
          quota_review_failure() {
            jq -e '.code == "MODEL_QUOTA" and .domain == "shared" and .component == "contextual-model"' phase-error.json >/dev/null
          }
          budget_review_failure() {
            jq -e '.code == "MODEL_REVIEW_BUDGET_EXCEEDED" and .domain == "target" and .component == "contextual-model"' phase-error.json >/dev/null
          }
          provider_no_progress_retries="0"
          for pass in $(seq 1 64); do
            progress_before="$(progress_count)"
            if run_review; then
              review_status="$(jq -er '.status' review-result.json)"
              if [[ "$review_status" == "review_pending" ]]; then
                continue
              fi
              if [[ "$review_status" == "reviewed" ]]; then
                exit 0
              fi
              exit 1
            fi
            progress_after="$(progress_count)"
            if budget_review_failure; then
              exit 1
            fi
            if ! retryable_review_failure || [[ "$pass" -eq 64 ]]; then
              exit 1
            fi
            if [[ "$progress_after" -gt "$progress_before" ]]; then
              if quota_review_failure; then
                rm -f phase-error.json
                sleep "$((pass * 60))"
              else
                rm -f phase-error.json
                sleep "$((pass * 5))"
              fi
              continue
            fi
            if provider_review_failure && [[ "$provider_no_progress_retries" -lt 1 ]]; then
              provider_no_progress_retries="$((provider_no_progress_retries + 1))"
              rm -f phase-error.json
              sleep "$((pass * 5))"
              continue
            fi
            exit 1
          done
          exit 1
      - name: Finalize contextual V5 report
        id: finalize
        if: steps.review.outcome == 'success'
        continue-on-error: true
        env:
          TAVERNKEEPER_SESSION_ROOT: ${{ runner.temp }}/tavernkeeper-session-${{ fromJSON(inputs.request_json).repository_id }}
          TAVERNKEEPER_ERROR_OUTPUT: phase-error.json
        run: npm run --silent finalize-target -- candidate.json
      - name: Record secret-free phase transition
        id: transition
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        env:
          TAVERNKEEPER_SCAN_REQUEST: ${{ inputs.request_json }}
        shell: bash
        run: |
          npm run --silent transition-result -- candidate.json transition.json phase-error.json
          echo "scan_failure=$(jq -r '.status == "failure"' transition.json)" >> "$GITHUB_OUTPUT"
      - name: Encrypt sanitized outcome
        if: always()
        env:
          TAVERNKEEPER_ARTIFACT_KEY: ${{ secrets.TAVERNKEEPER_ARTIFACT_KEY }}
        shell: bash
        run: |
          npm run --silent artifact-transport -- encrypt outcome-actual.enc candidate.json transition.json
          mv outcome-actual.enc "${{ runner.temp }}/tavernkeeper-outcome-${{ fromJSON(inputs.request_json).repository_id }}.enc"
      - name: Remove plaintext handoff files
        if: always()
        shell: bash
        run: rm -f candidate.json transition.json phase-error.json review-result.json
      - name: Upload encrypted scan outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-${{ fromJSON(inputs.request_json).repository_id }}
          path: ${{ runner.temp }}/tavernkeeper-outcome-${{ fromJSON(inputs.request_json).repository_id }}.enc
          if-no-files-found: error
          retention-days: 1
      - name: Mark this repository failed after a recorded scan failure
        if: ${{ always() && (steps.dependencies.outcome != 'success' || steps.download.outcome != 'success' || steps.restore.outcome != 'success' || steps.transition.outputs.scan_failure == 'true') }}
        run: exit 1

  publish:
    needs: scan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: tavernkeeper-scanner
    permissions:
      contents: read
      issues: write
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
      reports: ${{ steps.publish.outputs.reports }}
      failures: ${{ steps.publish.outputs.failures }}
      queue_remaining: ${{ steps.publish.outputs.queue_remaining }}
      queue_due: ${{ steps.publish.outputs.queue_due }}
      queue_delayed: ${{ steps.publish.outputs.queue_delayed }}
      next_wake_at: ${{ steps.publish.outputs.next_wake_at }}
      chronic_failures: ${{ steps.publish.outputs.chronic_failures }}
      automatic_holds: ${{ steps.publish.outputs.automatic_holds }}
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download encrypted outcome
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-${{ fromJSON(inputs.request_json).repository_id }}
          path: encrypted-artifact
      - name: Decrypt sanitized outcome
        env:
          TAVERNKEEPER_ARTIFACT_KEY: ${{ secrets.TAVERNKEEPER_ARTIFACT_KEY }}
        shell: bash
        run: |
          npm run --silent artifact-transport -- decrypt \
            "encrypted-artifact/tavernkeeper-outcome-${{ fromJSON(inputs.request_json).repository_id }}.enc" \
            artifacts/scan
      - name: Publish serialized target
        id: publish
        env:
          TAVERNKEEPER_SCAN_REQUEST: ${{ inputs.request_json }}
        shell: bash
        run: |
          result="$(npm run --silent publish -- artifacts)"
          printf '%s\n' "$result"
          reports="$(jq -er '.reports | select(type == "number")' <<< "$result")"
          failures="$(jq -er '.failures | select(type == "number")' <<< "$result")"
          queue_remaining="$(jq -er '.queue_remaining | select(type == "number")' <<< "$result")"
          queue_due="$(jq -er '.queue_due | select(type == "number")' <<< "$result")"
          queue_delayed="$(jq -er '.queue_delayed | select(type == "number")' <<< "$result")"
          next_wake_at="$(jq -r '.next_wake_at // ""' <<< "$result")"
          chronic_failures="$(jq -er '.chronic_failures | select(type == "number")' <<< "$result")"
          automatic_holds="$(jq -er '.automatic_holds | select(type == "number")' <<< "$result")"
          printf 'reports=%s\n' "$reports" >> "$GITHUB_OUTPUT"
          printf 'failures=%s\n' "$failures" >> "$GITHUB_OUTPUT"
          printf 'queue_remaining=%s\n' "$queue_remaining" >> "$GITHUB_OUTPUT"
          printf 'queue_due=%s\n' "$queue_due" >> "$GITHUB_OUTPUT"
          printf 'queue_delayed=%s\n' "$queue_delayed" >> "$GITHUB_OUTPUT"
          printf 'next_wake_at=%s\n' "$next_wake_at" >> "$GITHUB_OUTPUT"
          printf 'chronic_failures=%s\n' "$chronic_failures" >> "$GITHUB_OUTPUT"
          printf 'automatic_holds=%s\n' "$automatic_holds" >> "$GITHUB_OUTPUT"
      - name: Create TavernKeeper Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNKEEPER_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_PRIVATE_KEY }}
          owner: MentallyQuill
          repositories: TavernKeeper
          permission-contents: write
      - name: Commit report and state
        id: commit
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          TAVERNKEEPER_SCAN_REQUEST: ${{ inputs.request_json }}
        shell: bash
        run: |
          run_publication() {
            env -u GH_TOKEN -u GITHUB_TOKEN npm run --silent publish -- artifacts >/dev/null
          }
          commit_publication() {
            git add reports operations/state.json
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m "chore(reports): publish completed scan"
          }

          gh auth setup-git
          git config user.name "TavernKeeper"
          git config user.email "tavernkeeper@users.noreply.github.com"
          if commit_publication; then
            push_succeeded="false"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                push_succeeded="true"
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep "$((attempt * 15))"
                git fetch origin main
                git reset --hard origin/main
                run_publication
                if ! commit_publication; then
                  push_succeeded="true"
                  break
                fi
              fi
            done
            test "$push_succeeded" = "true"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Reconcile secret-free operational incidents
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/reconcile-operational-incidents.sh

  deploy:
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' && needs.publish.outputs.reports != '0' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      source_sha: ${{ needs.publish.outputs.source_sha }}
      automatic: true
    secrets: inherit

  incident:
    needs: [scan, publish]
    if: ${{ always() && needs.publish.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report bounded pipeline failure
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code="PUBLISH_PIPELINE_FAILED"
          component="publication"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create scanner-operations --color B60205 --description "TavernKeeper operational incidents" --force
          existing="$(gh issue list --state open --label scanner-operations --search "$code in:body" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "The bounded publication pipeline failed again: $run_url"
          else
            gh issue create \
              --label scanner-operations \
              --title "[scanner-operations] publication pipeline failed" \
              --body "TavernKeeper could not persist its sanitized target outcome. No scan payload or secret is included.\n\nCode: \`$code\`\nComponent: \`$component\`\nRun: $run_url\n\nAutomatic schedules remain enabled; inspect and repair the trusted publication boundary."
          fi

  continue:
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' && needs.publish.outputs.queue_remaining != '0' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Continue remaining backlog without inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main

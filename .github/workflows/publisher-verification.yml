name: Verify TavernKeeper Publisher

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tavernkeeper-publisher-verification
  cancel-in-progress: false

jobs:
  verify-scanner:
    if: ${{ github.actor_id == 2625904 && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: tavernkeeper-scanner
    permissions:
      contents: read
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Create TavernKeeper Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          client-id: ${{ vars.TAVERNKEEPER_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_PRIVATE_KEY }}
          owner: MentallyQuill
          repositories: TavernKeeper
          permission-contents: write
      - name: Verify scanner Publisher write
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          gh auth setup-git
          git config user.name "TavernKeeper"
          git config user.email "tavernkeeper@users.noreply.github.com"
          git commit --allow-empty -m "chore(ops): verify scanner Publisher access"
          push_succeeded="false"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              push_succeeded="true"
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 15))"
            fi
          done
          test "$push_succeeded" = "true"

  verify-staff:
    needs: verify-scanner
    if: ${{ github.actor_id == 2625904 && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: tavernkeeper-staff
    permissions:
      contents: read
    steps:
      - name: Check out trusted TavernKeeper main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Create TavernKeeper Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          client-id: ${{ vars.TAVERNKEEPER_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNKEEPER_PUBLISHER_APP_PRIVATE_KEY }}
          owner: MentallyQuill
          repositories: TavernKeeper
          permission-contents: write
      - name: Verify staff Publisher write
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          gh auth setup-git
          git config user.name "TavernKeeper"
          git config user.email "tavernkeeper@users.noreply.github.com"
          git commit --allow-empty -m "chore(ops): verify staff Publisher access"
          push_succeeded="false"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              push_succeeded="true"
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 15))"
            fi
          done
          test "$push_succeeded" = "true"

name: False-positive appeal
description: Ask TavernKeeper staff to review one finding in an immutable report.
title: "[False-positive appeal] "
labels:
  - false-positive-appeal
body:
  - type: markdown
    attributes:
      value: |
        This form requests staff review only. Submitting it does not trigger a TavernKeeper scan, does not change Tavernary, does not hide or dismiss a finding, and does not guarantee acceptance.
  - type: input
    id: report_url
    attributes:
      label: Immutable report URL
      description: Link to the exact TavernKeeper report page containing the finding.
      placeholder: https://mentallyquill.github.io/TavernKeeper/reports/github/...
    validations:
      required: true
  - type: input
    id: report_id
    attributes:
      label: Report ID
      description: The 64-character report ID shown on the immutable report.
    validations:
      required: true
  - type: input
    id: finding_fingerprint
    attributes:
      label: Finding fingerprint
      description: The 64-character fingerprint for the finding being appealed.
    validations:
      required: true
  - type: dropdown
    id: maintainer_relationship
    attributes:
      label: Relationship to the project
      options:
        - Owner or maintainer
        - Contributor
        - User
        - No formal relationship
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: Why should staff reconsider this finding?
      description: Explain the behavior and why the published interpretation may be incorrect. Do not include credentials, private source, or reusable exploit payloads.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I understand this appeal is reviewed manually and has no automatic effect.
          required: true

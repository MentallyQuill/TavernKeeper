name: False-positive appeal
description: Report evidence that may justify a global scanner-policy correction.
title: "[False-positive appeal] "
labels:
  - false-positive-appeal
body:
  - type: markdown
    attributes:
      value: |
        The existing report remains immutable. Submitting this appeal does not trigger a TavernKeeper scan, does not change Tavernary, and does not hide or dismiss a finding. It cannot edit, approve, or recolor an individual report. Evidence may motivate a global, versioned policy correction through ordinary code review; any resulting rescan is automatic.
  - type: input
    id: report_url
    attributes:
      label: Immutable report URL
      description: Link to the exact TavernKeeper report page containing the finding.
      placeholder: https://mentallyquill.github.io/TavernKeeper/reports/github/...
    validations:
      required: true
  - type: input
    id: report_id
    attributes:
      label: Report ID
      description: The 64-character report ID shown on the immutable report.
    validations:
      required: true
  - type: input
    id: finding_fingerprint
    attributes:
      label: Finding fingerprint
      description: The 64-character fingerprint for the finding being appealed.
    validations:
      required: true
  - type: dropdown
    id: maintainer_relationship
    attributes:
      label: Relationship to the project
      options:
        - Owner or maintainer
        - Contributor
        - User
        - No formal relationship
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: What global scanner defect does this evidence demonstrate?
      description: Explain the behavior and why the versioned scanner policy may be incorrect. Do not include credentials, private source, or reusable exploit payloads.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I understand the report remains immutable and only a global policy correction can affect future automated reports.
          required: true

rules:
  - id: tavernkeeper.credential-exfiltration.javascript-secret-to-network
    message: A credential-bearing value reaches an outbound network API.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      tavernkeeper_category: credential-theft
      tavernkeeper_severity: high
      tavernkeeper_confidence: high
      tavernkeeper_title: Credential source reaches network sink
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: process.env.$KEY
          - pattern: process.env[$KEY]
          - pattern: document.cookie
          - pattern: localStorage.getItem(...)
          - pattern: sessionStorage.getItem(...)
    pattern-sinks:
      - pattern-either:
          - pattern: fetch(...)
          - pattern: $CLIENT.fetch(...)
          - pattern: axios.$METHOD(...)
          - pattern: $CLIENT.send(...)
          - pattern: navigator.sendBeacon(...)
          - pattern: new WebSocket(...)

  - id: tavernkeeper.credential-exfiltration.python-secret-to-network
    message: A credential-bearing value reaches an outbound network API.
    severity: ERROR
    languages: [python]
    metadata:
      tavernkeeper_category: credential-theft
      tavernkeeper_severity: high
      tavernkeeper_confidence: high
      tavernkeeper_title: Credential source reaches network sink
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: os.environ[$KEY]
          - pattern: os.environ.get(...)
          - pattern: os.getenv(...)
          - pattern: keyring.get_password(...)
    pattern-sinks:
      - pattern-either:
          - pattern: requests.$METHOD(...)
          - pattern: urllib.request.urlopen(...)
          - pattern: $SOCKET.send(...)
          - pattern: $SOCKET.sendall(...)

  - id: tavernkeeper.reconnaissance-transmission.javascript-host-data-to-network
    message: Host or user reconnaissance data reaches an outbound network API.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      tavernkeeper_category: reconnaissance
      tavernkeeper_severity: medium
      tavernkeeper_confidence: medium
      tavernkeeper_title: Host reconnaissance reaches network sink
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: os.hostname()
          - pattern: os.userInfo()
          - pattern: os.networkInterfaces()
          - pattern: process.env.USERNAME
          - pattern: process.env.USER
    pattern-sinks:
      - pattern-either:
          - pattern: fetch(...)
          - pattern: axios.$METHOD(...)
          - pattern: $CLIENT.send(...)
          - pattern: navigator.sendBeacon(...)

  - id: tavernkeeper.reconnaissance-transmission.python-host-data-to-network
    message: Host or user reconnaissance data reaches an outbound network API.
    severity: WARNING
    languages: [python]
    metadata:
      tavernkeeper_category: reconnaissance
      tavernkeeper_severity: medium
      tavernkeeper_confidence: medium
      tavernkeeper_title: Host reconnaissance reaches network sink
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: socket.gethostname()
          - pattern: getpass.getuser()
          - pattern: platform.uname()
          - pattern: os.getlogin()
    pattern-sinks:
      - pattern-either:
          - pattern: requests.$METHOD(...)
          - pattern: urllib.request.urlopen(...)
          - pattern: $SOCKET.send(...)
          - pattern: $SOCKET.sendall(...)
